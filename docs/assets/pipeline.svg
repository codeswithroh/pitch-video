<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#0b0d18" rx="18"/><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#ffe040" d="M0 0L10 5L0 10z"/></marker><style>.box{fill:#141829;stroke:#2e3452;stroke-width:1.5}.t{fill:#fff;font-size:17px;font-weight:700}.h,.s{font-size:13px}.s{fill:#9aa0c0}.h{fill:#ffe040;font-weight:700;letter-spacing:1.5px}.l{stroke:#ffe040;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><text x="40" y="44" class="h">YOU GIVE IT</text><rect width="250" height="78" x="40" y="62" class="box" rx="12"/><text x="58" y="94" class="t">🎙 Talking-head video</text><text x="58" y="118" class="s">phone, webcam, Loom, QuickTime</text><rect width="250" height="78" x="40" y="152" class="box" rx="12"/><text x="58" y="184" class="t">📝 Your script (optional)</text><text x="58" y="208" class="s">**bold** becomes caption emphasis</text><rect width="250" height="78" x="40" y="242" class="box" rx="12"/><text x="58" y="274" class="t">🖥 Your product</text><text x="58" y="298" class="s">URL, dev server or repo</text><text x="350" y="44" class="h">THE SKILL DOES</text><rect width="250" height="60" x="350" y="62" class="box" rx="12"/><text x="368" y="90" class="t">Align A/V · transcribe</text><text x="368" y="110" class="s">per-chunk Whisper + script fix</text><rect width="250" height="60" x="350" y="134" class="box" rx="12"/><text x="368" y="162" class="t">Trim pauses · 1.1× speed</text><text x="368" y="182" class="s">frame + sample exact cuts</text><rect width="250" height="60" x="350" y="206" class="box" rx="12"/><text x="368" y="234" class="t">Film the product</text><text x="368" y="254" class="s">scripted CDP screencast + event log</text><rect width="250" height="60" x="350" y="278" class="box" rx="12"/><text x="368" y="306" class="t">Cut visuals to the words</text><text x="368" y="326" class="s">scenes anchored to spoken phrases</text><rect width="250" height="60" x="660" y="62" class="box" rx="12"/><text x="678" y="90" class="t">Captions · chips · cards</text><text x="678" y="110" class="s">HTML → alpha tracks</text><rect width="250" height="60" x="660" y="134" class="box" rx="12"/><text x="678" y="162" class="t">Explainer animation</text><text x="678" y="182" class="s">beats keyed to narration</text><rect width="250" height="60" x="660" y="206" class="box" rx="12"/><text x="678" y="234" class="t">Cinematic SFX + music</text><text x="678" y="254" class="s">ducked under every word</text><rect width="250" height="60" x="660" y="278" class="box" rx="12"/><text x="678" y="306" class="t">Verify (gate)</text><text x="678" y="326" class="s">lip sync · drift · loudness · SNR</text><text x="970" y="44" class="h">YOU GET</text><rect width="190" height="276" x="970" y="62" fill="#1d1a08" stroke="#ffe040" stroke-width="2" rx="14"/><text x="990" y="100" class="t">demo.mp4</text><text x="990" y="128" class="s">1080p · 30 fps</text><text x="990" y="152" class="s">face bubble</text><text x="990" y="176" class="s">burned-in captions</text><text x="990" y="200" class="s">scene chips</text><text x="990" y="224" class="s">−14 LUFS master</text><text x="990" y="248" class="s">demo_small.mp4</text><text x="990" y="296" class="t" style="fill:#ffe040">PASS ✓</text><path d="M292 190 H340" class="l"/><path d="M602 200 H650" class="l"/><path d="M912 200 H960" class="l"/><text x="40" y="384" class="s">Every stage writes plain files (timeline.json, project.json, captions.json), so any step can be inspected, tweaked and re-run on its own.</text></svg>